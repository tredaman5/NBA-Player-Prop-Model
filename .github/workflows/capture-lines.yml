name: Capture sportsbook lines

# Captures each game's player-points lines about 30-60 minutes before tip-off and
# appends them to a log in a PRIVATE repo (this repo is public, and the Odds API's
# terms bar publishing their data as files). See the README for the one-time setup.
#
# Free-tier friendly: listing games is free, so polling every 15 minutes costs
# nothing; only an actual capture spends a credit (1 per game, points only).

on:
  schedule:
    # Every 15 minutes, 15:00-03:59 UTC = 11:00am-11:59pm US Eastern during daylight
    # time (10:00am-10:59pm in winter). Covers noon matinees through 10:30pm tip-offs.
    # GitHub may delay scheduled runs by several minutes; the 60-minute capture window
    # below absorbs that.
    - cron: "*/15 15-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list what would be captured, spend no credits"
        type: boolean
        default: true

permissions:
  contents: read

# Never let two runs overlap: they would race on the log and double-spend credits.
concurrency:
  group: capture-lines
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-capture.txt

      - name: Install dependencies
        run: pip install -r requirements-capture.txt

      - name: Check out the private data repo
        uses: actions/checkout@v4
        with:
          repository: tredaman5/nba-prop-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data_repo

      - name: Capture lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Manual runs default to a dry run; scheduled runs are always real.
          EXTRA_ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: |
          python -m src.odds.capture_lines \
            --log-path data_repo/odds_lines_log.csv \
            --within-minutes 60 \
            $EXTRA_ARGS

      - name: Save the log to the private repo
        working-directory: data_repo
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "line-capture-bot"
            git config user.email "line-capture-bot@users.noreply.github.com"
            git add odds_lines_log.csv
            git commit -m "capture lines $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Nothing new to save."
          fi
