name: Daily slate

# Builds the day's slate (projection next to the median sportsbook line) each time a line capture
# finishes, and saves the page to the PRIVATE data repo. The page contains real sportsbook lines, so
# it never goes in this public repo. Read it by pulling your clone of the data repo and opening
# slates/latest.html. See the README for the one-time setup (copying the trained models over).

on:
  workflow_run:
    workflows: ["Capture sportsbook lines"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date, YYYY-MM-DD (blank = today, US Eastern)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-slate
  cancel-in-progress: false

jobs:
  slate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Pinned versions matter: the model files are pickles from this exact scikit-learn.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check out the private data repo
        uses: actions/checkout@v4
        with:
          repository: tredaman5/nba-prop-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data_repo

      - name: Verify the data repo is writable
        working-directory: data_repo
        run: git push --dry-run origin HEAD:main

      # Exit code 2 means "no games or no captured lines for that date": a quiet day, not a failure.
      - name: Build the slate
        id: run
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set +e
          args=(--log-path data_repo/odds_lines_log.csv --models-dir data_repo/models --out-dir out --include-started)
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          python -m src.pipeline.daily "${args[@]}"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then
            echo "::notice::No games or captured lines for this date; nothing to publish."
            exit 0
          fi
          exit $code

      - name: Save the slate to the private repo
        if: always() && steps.run.outputs.code != ''
        working-directory: data_repo
        run: |
          mkdir -p slates
          cp ../out/*.html ../out/*.json ../out/*.csv slates/ 2>/dev/null || true
          latest=$(ls -t ../out/slate_*.html 2>/dev/null | head -1)
          if [ -n "$latest" ]; then cp "$latest" slates/latest.html; fi
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "slate-bot"
            git config user.email "slate-bot@users.noreply.github.com"
            git add slates
            git commit -m "slate $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          else
            echo "Nothing new to save."
          fi
